# Pruebas en las dos versiones de MariaDB que importan y construcción del programa para Windows.
#   - pruebas:  toda la suite contra MariaDB 10.3 (la rama del servidor del negocio) y 10.11 (la recomendada).
#   - windows:  genera Oceanica.exe / OceanicaAdmin.exe y el instalador, comprueba que arrancan y los deja
#               como archivos descargables de la ejecución (pestaña Actions -> la ejecución -> Artifacts).
#   - publicar: solo en main y con todo en verde, publica Oceanica_Gestion.zip (instalador + LEEME) como release.
#               Enlace fijo: https://github.com/mauugr09/Lavander-a-Ocean-ca/releases/latest
# No prueba la impresora ni la PC del local: eso sigue siendo una verificación en sitio.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    name: Pruebas (MariaDB ${{ matrix.mariadb }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mariadb: ["10.3", "10.11"]
    services:
      mariadb:
        image: mariadb:${{ matrix.mariadb }}
        env:
          MYSQL_ROOT_PASSWORD: raiz_de_pruebas
          MYSQL_DATABASE: oceanica_test
          MYSQL_USER: oc_test
          MYSQL_PASSWORD: oc_test_pw
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -praiz_de_pruebas --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      QT_QPA_PLATFORM: offscreen
      OCEANICA_TEST_DB_HOST: 127.0.0.1
      OCEANICA_TEST_DB_PORT: "3306"
      OCEANICA_TEST_DB_USER: oc_test
      OCEANICA_TEST_DB_PASSWORD: oc_test_pw
      OCEANICA_TEST_DB_NAME: oceanica_test
      OCEANICA_TEST_ROOT_PASSWORD: raiz_de_pruebas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Librerías de Qt y cliente de MariaDB (mysqldump para las pruebas de respaldo)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libxcb-cursor0 mariadb-client
      - name: Cliente de MariaDB sin TLS (el servidor de pruebas no lo ofrece y el cliente nuevo lo exige)
        run: printf '[client]\nskip-ssl\n' > ~/.my.cnf
      - name: Dependencias de Python
        run: pip install -r requirements.txt
      - name: Versión del servidor
        run: |
          mysql --version
          mysql -h 127.0.0.1 -uroot -praiz_de_pruebas -e "SELECT VERSION()"
      - name: Pruebas
        # -rs lista las pruebas omitidas: una omisión por falta de base o de mysqldump no debe pasar inadvertida
        run: python -m pytest -q -rs tests

  windows:
    name: Programa para Windows (.exe e instalador)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Dependencias y PyInstaller
        run: pip install -r requirements.txt pyinstaller
      - name: Construir Oceanica.exe y OceanicaAdmin.exe
        run: pyinstaller oceanica.spec --noconfirm --clean
      - name: El programa de consola arranca (importa configuración, base y respaldos)
        shell: pwsh
        run: |
          $salida = & dist\Oceanica\OceanicaAdmin.exe respaldo --help
          if ($LASTEXITCODE -ne 0) { throw "OceanicaAdmin.exe terminó con código $LASTEXITCODE" }
          $salida
          if (-not ($salida -match "--restaurar")) { throw "La ayuda de respaldos no es la esperada" }
      - name: La ventana arranca y sigue abierta (sin base configurada abre el asistente, no se cae)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          OCEANICA_HOME: ${{ runner.temp }}\oceanica_datos
        run: |
          $p = Start-Process -FilePath dist\Oceanica\Oceanica.exe -PassThru
          Start-Sleep -Seconds 12
          $registro = "$env:OCEANICA_HOME\logs\oceanica.log"
          if (Test-Path $registro) { Get-Content $registro -Tail 20 }
          if ($p.HasExited) { throw "Oceanica.exe se cerró solo con código $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
      - name: El respaldo diario queda programado en Windows (y se puede quitar)
        shell: pwsh
        env:
          OCEANICA_HOME: ${{ runner.temp }}\oceanica_datos
        run: |
          & dist\Oceanica\OceanicaAdmin.exe programar-respaldo
          if ($LASTEXITCODE -ne 0) { throw "programar-respaldo terminó con código $LASTEXITCODE" }
          [xml]$tarea = schtasks /Query /TN "\Oceanica\Respaldo diario" /XML | Out-String
          $t = $tarea.Task
          $t.Actions.Exec.Command; $t.Actions.Exec.Arguments; $t.Triggers.CalendarTrigger.StartBoundary
          if ($t.Settings.StartWhenAvailable -ne "true") { throw "Sin StartWhenAvailable: si la PC está apagada no respalda" }
          if (-not ($t.Actions.Exec.Command -like "*OceanicaAdmin.exe")) { throw "La tarea no llama a OceanicaAdmin.exe" }
          if ($t.Actions.Exec.Arguments -ne "respaldo --auto") { throw "Argumentos inesperados" }
          if (-not ($t.Triggers.CalendarTrigger.StartBoundary -like "*T21:00:00")) { throw "Hora inesperada" }
          & dist\Oceanica\OceanicaAdmin.exe programar-respaldo --quitar
          schtasks /Query /TN "\Oceanica\Respaldo diario" 2>$null
          if ($LASTEXITCODE -eq 0) { throw "La tarea sigue existiendo después de quitarla" }
          $global:LASTEXITCODE = 0
      - name: MariaDB 10.11 LTS para meterlo en el instalador
        shell: pwsh
        run: |
          $url = "https://archive.mariadb.org/mariadb-10.11.10/winx64-packages/mariadb-10.11.10-winx64.msi"
          Invoke-WebRequest -Uri $url -OutFile dist\mariadb.msi -UseBasicParsing
          $tam = (Get-Item dist\mariadb.msi).Length
          "mariadb.msi: $tam bytes"
          if ($tam -lt 30MB) { throw "La descarga de MariaDB parece incompleta" }
          Get-FileHash dist\mariadb.msi -Algorithm SHA256
      - name: Instalador (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc instalador.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup falló con código $LASTEXITCODE" }
      - name: El instalador deja todo listo en una PC sin base de datos
        shell: pwsh
        env:
          OCEANICA_HOME: ${{ runner.temp }}\oceanica_limpia
          QT_QPA_PLATFORM: offscreen
        run: |
          # La imagen de GitHub trae MySQL: se quita para simular la PC de un cliente sin base de datos.
          Get-Service | Where-Object { $_.Name -match '^(mysql|mariadb)' } | ForEach-Object {
            Stop-Service $_.Name -Force -ErrorAction SilentlyContinue; sc.exe delete $_.Name | Out-Null }
          $p = Start-Process dist\Instalar_Oceanica.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/LOG=$env:RUNNER_TEMP\instalador.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\instalador.log" -Tail 40; throw "El instalador terminó con código $($p.ExitCode)" }
          $s = Get-Service MariaDB -ErrorAction SilentlyContinue
          if (-not $s -or $s.Status -ne 'Running') { Get-Content "$env:RUNNER_TEMP\instalador.log" -Tail 40; throw "MariaDB no quedó instalado y encendido" }
          $exe = "${env:ProgramFiles}\Oceanica\Oceanica.exe"
          if (-not (Test-Path $exe)) { throw "No quedó $exe" }
          # Lo mismo que hace el asistente de primera vez, contra la MariaDB que acaba de instalar el instalador
          python -c "from oceanica import instalacion as i; e = i.estado_servidor(); print('estado:', e); assert e == i.ROOT_SIN_CONTRASENA, e; r = i.instalar(root_actual='', nueva_root='Recupera#2026', usuario_admin='encargada', password_admin='Encargada#2026'); print('admin creado:', r['admin_creado']); assert i.estado_servidor() == i.ROOT_CON_CONTRASENA"
          if ($LASTEXITCODE -ne 0) { throw "La instalación de la base falló" }
          # Los respaldos encuentran mysqldump aunque no esté en el PATH (se quita el MySQL que trae la imagen de GitHub)
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -notmatch 'MySQL|MariaDB' }) -join ';'
          python -c "from oceanica.respaldos import _buscar, crear_respaldo; r = _buscar('mysqldump'); print(r); assert 'MariaDB' in r, r; print(crear_respaldo('manual'))"
          if ($LASTEXITCODE -ne 0) { throw "El respaldo no funcionó con la MariaDB instalada" }
          # El programa instalado abre conectado a la base (pantalla de entrada) y no se cierra solo
          $app = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 15
          $registro = "$env:OCEANICA_HOME\logs\oceanica.log"
          if (Test-Path $registro) { Get-Content $registro -Tail 20 }
          if ($app.HasExited) { throw "Oceanica.exe se cerró solo con código $($app.ExitCode)" }
          Stop-Process -Id $app.Id -Force
      - name: Guardar el instalador
        uses: actions/upload-artifact@v4
        with:
          name: Instalar_Oceanica
          path: dist/Instalar_Oceanica.exe
          if-no-files-found: error
          retention-days: 30
      - name: Guardar la carpeta del programa (sin instalador)
        uses: actions/upload-artifact@v4
        with:
          name: Oceanica_carpeta
          path: dist/Oceanica
          if-no-files-found: error
          retention-days: 14

  publicar:
    name: Publicar el zip del programa
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [pruebas, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Instalar_Oceanica
          path: paquete
      - name: Armar Oceanica_Gestion.zip
        run: |
          cp LEEME.txt paquete/
          cd paquete && zip -9 ../Oceanica_Gestion.zip Instalar_Oceanica.exe LEEME.txt && cd ..
          unzip -l Oceanica_Gestion.zip
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          etiqueta="v1.2.${{ github.run_number }}"
          gh release create "$etiqueta" Oceanica_Gestion.zip --target "${{ github.sha }}" --latest \
            --title "Oceánica Gestión $etiqueta" \
            --notes "Instalador de Windows (incluye MariaDB). Descomprima y lea LEEME.txt. Commit ${{ github.sha }}."
